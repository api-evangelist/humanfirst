aid: humanfirst
name: HumanFirst
description: >-
  HumanFirst is a digital health measurement company whose Atlas platform helps
  clinical research and life-sciences teams evaluate, select, and operationalize
  sensor-based digital health technologies — wearables, connected devices, and
  digital biomarkers — for clinical trials and real-world evidence. Atlas curates
  a knowledge network of digital measures, connected devices, and the published
  evidence behind them so sponsors and CROs can choose fit-for-purpose measures.
  HumanFirst is now part of ICON plc and integrated into ICON's Digital Health
  Technologies (DHT) capabilities. The Atlas platform is delivered as an
  authenticated web application at app.gohumanfirst.com; the company does not
  currently publish a public developer API. This profile captures the company's
  public identity, security, and compliance posture for the API Evangelist network.
